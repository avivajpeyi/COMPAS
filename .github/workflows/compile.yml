name: COMPAS compile test

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths: ['src/**', '.github/workflows/**']
  push:
    branches: [dev]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        env:
          RUNNER_OS: ${{ runner.os }}
        run: |
          case $RUNNER_OS in
            Linux)
              sudo apt-get install -y g++ libboost-all-dev libgsl-dev libhdf5-serial-dev
              ;;
            macOS)
              brew install gsl boost hdf5
              ;;
            Windows)
              choco install boost-msvc-14.3
              ;;
          esac
        shell: bash

      - name: Build and test
        run: |
          cd src && make -j $(nproc || sysctl -n hw.ncpu || echo 4) -f Makefile
          ./COMPAS -v
        shell: bash
